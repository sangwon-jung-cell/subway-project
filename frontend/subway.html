<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATION AI MONITORING</title>
    <link rel="stylesheet" href="subway.css">
</head>
<body>

<header>
    <h1>STATION AI MONITORING</h1>
    <div id="status">● 시스템 가동 중</div>
</header>

<div class="nav-tabs">
    <button class="tab-button active" onclick="switchView('main')">실시간 감지 & 설정</button>
    <button class="tab-button" onclick="switchView('history')">최근 기록 조회</button>
    <button class="tab-button" id="detailTabButton" onclick="switchView('detail')" style="display: none;">상세 보기</button>
</div>

<!-- 메인 화면 -->
<div id="viewMain" class="view-content active">
    <div class="scanner-container">
        <div class="main-circle" onclick="simulateDetection()">
            <div class="circle-inner">
                <div class="power-icon">
                    <img src="secure.png" alt="Secure Icon" class="main-icon-img">
                </div>
                <div class="status-text">REAL-TIME<br>MONITORING</div>
                <div class="sub-text">Click to Test Signal</div>
            </div>
            <div class="scanner-line"></div>
            <div class="scanner-line second"></div>
        </div>
        <p class="monitoring-desc">시스템이 게이트를 실시간으로 스캐닝하고 있습니다.</p>

        <!-- 테스트 및 안내 구역 -->
        <div class="test-zone">
             <p class="info-msg">※ 저장된 데이터는 8일째 되는 날 자동으로 삭제됩니다.</p>
             <div class="test-buttons">
                 <button onclick="createTestData(3)">3일 전 생성</button>
                 <button onclick="createTestData(7)">7일 전 생성</button>
                 <button onclick="resetAllData()" class="reset-btn">전체 기록 초기화</button>
             </div>
         </div>
    </div>
</div>

<!-- 기록 조회 화면 -->
<div id="viewHistory" class="view-content">
    <div class="history-header">
        <h2>최근 7일 감지 기록</h2>
        <p class="warning-text">보라색 테두리 항목은 곧 삭제될 데이터입니다.</p>
    </div>
    <div id="historyGroupsContainer"></div>
</div>

<!-- 상세 보기 화면 -->
<div id="viewDetail" class="view-content">
    <div class="detail-container">
        <button class="tab-button" onclick="switchView('history')" style="margin-bottom: 20px;">← 돌아가기</button>
        <div class="detail-img-wrapper">
            <img id="detailImage" src="" alt="확대 장면">
        </div>
        <div class="detail-info">
            <h3 id="detailType">부정승차 유형</h3>
            <div class="detail-meta">
                <div class="meta-item">
                    <span class="meta-label">발생 일시</span>
                    <span class="meta-value" id="detailTime">-</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">감지 위치</span>
                    <span class="meta-value">Gate 03 (메인 개찰구)</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 오버레이 및 알림창 -->
<div id="modalOverlay"></div>
<div id="alertModal">
    <h2>🚨 DANGER</h2>
    <div id="alertDetails">부정승차 감지됨!</div>
    <button class="modal-btn" onclick="closeAlert()">상황 확인 완료</button>
</div>

<script src="subway.js"></script>
</body>
</html>
