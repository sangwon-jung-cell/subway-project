services:
  # 0. AI 학습 모델
  ai_trainer:
    build:
      context: ./AI
      dockerfile: Dockerfile_ai
    container_name: subway_ai
    volumes:
      # [내 노트북 경로] : [컨테이너 내부 경로]
      - ./AI:/usr/src/app
    tty: true      # 컨테이너가 바로 꺼지지 않게 함
    stdin_open: true
    # GPU를 사용하기 위한 설정 (로컬에 NVIDIA Container Toolkit이 설치되어 있어야 함)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 1. 백엔드 서비스
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile_backend
    container_name: subway_backend
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static  # 이미지 저장 폴더 동기화
    ports:
      - "8000:8000"
    restart: always


  # 2. 프론트엔드 서비스 (Nginx 사용)
  frontend:
    image: nginx:alpine
    container_name: subway_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro  # 내 html 파일을 nginx 경로에 연결
    ports:
      - "80:80"  # 브라우저에서 localhost로 접속 가능
    depends_on:
      - backend


  # 3. 데이터베이스 (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: subway_db
    restart: always
    environment:
      POSTGRES_USER: myuser          # 사용자 이름 (원하는 대로 수정)
      POSTGRES_PASSWORD: mypassword  # 비밀번호 (원하는 대로 수정)
      POSTGRES_DB: subway_db         # 데이터베이스 이름
    volumes:
      - postgres_data:/var/lib/postgresql/data # DB 데이터를 내 노트북에 보관
    ports:
      - "5432:5432"


# DB 데이터를 영구적으로 저장하기 위한 볼륨 선언
volumes:
  postgres_data:

