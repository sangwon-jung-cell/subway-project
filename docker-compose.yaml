services:
  # 1. 데이터베이스 (PostgreSQL) - 백엔드보다 먼저 떠야 하므로 위로 배치
  db:
    image: postgres:15-alpine
    container_name: subway_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: subway_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. 백엔드 서비스 (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile_backend
    container_name: subway_backend
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
    ports:
      - "8000:8000"
    environment:
      # DB 접속 정보를 환경변수로 고정 (main.py에서 os.getenv로 사용)
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/subway_db
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: